name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The 'local' and 'api' extras are deliberately excluded: CI proves the
          # instrument, and the instrument is proven against the deterministic
          # oracle scorer, not against a downloaded model. 'parquet' is included
          # because the loaders that need it are part of the tested surface.
          python -m pip install -e ".[parquet,dev]"

      - name: Lint
        run: python -m ruff check src tests verify.py

      - name: Format check
        run: python -m ruff format --check src tests verify.py

      - name: Types
        run: python -m mypy

      - name: Tests
        run: python -m pytest -m "not slow" --cov=evalassay --cov-report=term-missing

      - name: Calibration harness
        # The claim "this instrument recovers a planted effect" is only worth
        # anything if the check runs on every commit.
        run: python -m pytest -m slow -k calibration
  # The gitleaks binary directly rather than gitleaks-action, and the whole
  # history rather than a diff. The action scans only the range
  # <before>^..<after> that a push touched, so a secret committed earlier and
  # never edited again is never looked at; and on a repository's first push the
  # parent of the root commit does not exist, so it fails outright.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: gitleaks detect --source . --redact --exit-code 1 --log-opts=--all
